name: CI

on:
  push:
    branches: [development]
  pull_request:

# CI only reads the checkout; grant the GITHUB_TOKEN nothing more.
permissions:
  contents: read

jobs:
  web:
    name: Packages + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # The lockfile records every platform's native packages (cpu/os metadata),
      # so `npm ci` installs the right ones for this runner and stays exactly
      # reproducible. This mirrors the Dockerfile, which installs the same way.
      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages
      - run: npm run test:packages
      - run: npm run test:frontend
      - run: npm run lint:frontend
      - run: npm run build:frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: /api

  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      # Database-integration tests skip automatically when DATABASE_URL is unset;
      # the rest of the suite runs here. To run them in CI, add a postgres service,
      # set DATABASE_URL + JWT_SECRET, and run `go run ./cmd/migrate` first.
      - run: go test ./...
