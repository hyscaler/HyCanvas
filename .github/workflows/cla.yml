# CLA gate: every external pull request must have a signed Contributor License
# Agreement (CLA.md) before merge. Signatures are recorded on the dedicated
# `cla-signatures` branch by CLA Assistant Lite; contributors sign by posting
# the acceptance comment on their PR. Required so HyScaler can dual-license
# (Elastic License 2.0 + commercial) with clear rights in every contribution.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/cla.json"
          path-to-document: "https://github.com/hyscaler/HyCanvas/blob/development/CLA.md"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: >
            Thank you for the contribution. Before we can merge, we need you to
            sign the [HyCanvas Contributor License Agreement](https://github.com/hyscaler/HyCanvas/blob/development/CLA.md).
            Please read it and post the comment below on this pull request.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
