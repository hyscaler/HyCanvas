name: Docker Build and Push

# Publishes the single self-contained HyCanvas image to Docker Hub, BUILT
# FROM SOURCE, for image-only publishes between releases:
#   docker/build/latest       -> tags :latest      (+ :<version>-<sha>)
#   docker/build/development  -> tags :development (+ :<version>-<sha>)
# Release tags publish the image separately (and much faster) from the
# prebuilt release binaries: see the docker job in release.yml.
#
# Requires two repository secrets: DOCKER_USERNAME and DOCKER_PASSWORD
# (a Docker Hub access token, not the account password).

on:
  push:
    branches:
      - docker/build/latest
      - docker/build/development

permissions:
  contents: read

env:
  DOCKER_IMAGE: hycanvas/hycanvas
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          case "$REF_NAME" in
            docker/build/latest) DOCKER_TAG="latest" ;;
            docker/build/development) DOCKER_TAG="development" ;;
            *) DOCKER_TAG="manual" ;;
          esac
          VERSION="$(grep -m1 '"version"' package.json | cut -d'"' -f4)-${SHORT_SHA}"
          TAGS="${DOCKER_IMAGE}:${DOCKER_TAG},${DOCKER_IMAGE}:${VERSION}"
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-${{ steps.meta.outputs.docker_tag }}
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache-${{ steps.meta.outputs.docker_tag }},mode=max

      # The Docker Hub repo description (the listing page) is synced from
      # docker/README.md by .github/workflows/dockerhub-description.yml.

      - name: Summary
        run: |
          {
            echo "## Docker build summary"
            echo ""
            echo "**Image**: \`${{ env.DOCKER_IMAGE }}\`"
            echo "**Ref**: \`${{ github.ref_name }}\`"
            echo "**Platforms**: \`${{ env.PLATFORMS }}\`"
            echo "**Tags**: \`${{ steps.meta.outputs.tags }}\`"
            echo ""
            echo "Pull:"
            echo '```bash'
            echo "docker pull ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.docker_tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
