name: Docker Hub Description

# Syncs docker/README.md to the Docker Hub repository overview:
# https://hub.docker.com/r/hycanvas/hycanvas
#
# Runs when the README (or this workflow) changes on development, and on
# manual dispatch. Uses the same DOCKER_USERNAME / DOCKER_PASSWORD secrets as
# docker-build-push.yml; the access token needs read/write scope.

on:
  push:
    branches: [development]
    paths:
      - docker/README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_REPO: hycanvas/hycanvas

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update Docker Hub overview
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          BODY=$(mktemp)
          STATUS=$(jq -n --arg u "$DOCKER_USERNAME" --arg p "$DOCKER_PASSWORD" '{username: $u, password: $p}' |
            curl -s -o "$BODY" -w '%{http_code}' -H "Content-Type: application/json" \
              -d @- https://hub.docker.com/v2/users/login/)
          if [ "$STATUS" != "200" ]; then
            echo "Docker Hub login failed (HTTP ${STATUS}): $(cat "$BODY")" >&2
            exit 1
          fi
          TOKEN=$(jq -r '.token // empty' "$BODY")
          if [ -z "$TOKEN" ]; then
            echo "Docker Hub login returned no token" >&2
            exit 1
          fi
          STATUS=$(jq -n --rawfile desc docker/README.md '{full_description: $desc}' |
            curl -s -o "$BODY" -w '%{http_code}' -X PATCH \
              -H "Authorization: JWT ${TOKEN}" -H "Content-Type: application/json" \
              -d @- "https://hub.docker.com/v2/repositories/${DOCKER_REPO}/")
          if [ "$STATUS" != "200" ]; then
            echo "Description update failed (HTTP ${STATUS}): $(cat "$BODY")" >&2
            exit 1
          fi
          echo "Docker Hub overview updated from docker/README.md ($(wc -c < docker/README.md) bytes)"
