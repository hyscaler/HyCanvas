name: Docker Hub Description

# Syncs docker/README.md to the Docker Hub repository overview:
# https://hub.docker.com/r/hycanvas/hycanvas
#
# Runs when the README (or this workflow) changes on development, and on
# manual dispatch. Uses the same DOCKER_USERNAME / DOCKER_PASSWORD secrets as
# docker-build-push.yml; the access token needs Read, Write, Delete scope
# (Docker Hub requires it for the description API).

on:
  push:
    branches: [development]
    paths:
      - docker/README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_REPO: hycanvas/hycanvas

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKER_REPO }}
          readme-filepath: ./docker/README.md
          short-description: "Free, self-hostable, AI-native alternative to Canva. No paywalls, no watermarks."
