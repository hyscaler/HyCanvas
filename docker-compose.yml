# HyCanvas - self-host stack (PUBLISHED IMAGE), bring-your-own Postgres.
#
#   cp .env.example .env   # set JWT_SECRET + DATABASE_URL (your managed Postgres)
#   docker compose up -d
#
# Pulls the published hycanvas/hycanvas image and runs the whole product (UI +
# API + realtime) at http://localhost:${APP_PORT}; the Go app applies migrations
# on boot. Update later with `docker compose pull && docker compose up -d`. To
# BUILD from source instead, use docker-compose.prod.yml; for local development
# with hot reload, use docker-compose.dev.yml.
#
# Database: this file ships NO bundled Postgres. Point it at your managed
# Postgres by setting DATABASE_URL (or EXTERNAL_DATABASE_URL) in .env. Other
# secrets (JWT_SECRET, SMTP_*, OIDC_*, AI keys, VAPID_*, ...) also come from .env.

services:
  app:
    image: hycanvas/hycanvas:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8005"
    # All app config/secrets (JWT_SECRET, SMTP_*, OIDC_*, OPENAI/ANTHROPIC keys,
    # VAPID_*, APP_URL, FRONTEND_URL, ...) come from your .env. The file is
    # optional, but JWT_SECRET is REQUIRED: the app refuses to start without it,
    # and no default is provided here. Set it in .env (e.g. `openssl rand -hex 32`).
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8005"
      DB_AUTO_MIGRATE: "true"
      # Served over plain http://localhost here, so cookies must NOT be Secure or
      # the browser drops the session and login fails. Behind a TLS proxy, set
      # this to "true" (and point APP_URL at your https origin).
      COOKIE_SECURE: "false"
      # Bring-your-own managed Postgres: EXTERNAL_DATABASE_URL wins, else the
      # DATABASE_URL from .env. There is no bundled db container in this file, so
      # one of them must be set (an empty value fails loudly at boot).
      DATABASE_URL: "${EXTERNAL_DATABASE_URL:-${DATABASE_URL:-}}"
      # Single-instance self-host: no Redis. A REDIS_URL in your .env is for native
      # dev (host Redis); in the container localhost is not the host and this compose
      # ships no redis service, so a set-but-unreachable REDIS_URL crash-loops the app
      # on boot. Force it empty here. For multi-instance, add a redis service and set
      # REDIS_URL to redis://<service>:6379/0.
      REDIS_URL: ""
      # Storage driver comes from .env (defaults to local); set STORAGE_DRIVER=s3
      # plus the S3_* vars there to use object storage. LOCAL_STORAGE_PATH stays
      # pinned to the container path on purpose: a host absolute path from .env
      # would not exist inside the container.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /app/.data/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Persists local-file storage on the host when STORAGE_DRIVER=local; unused
    # (but harmless) when using S3.
    volumes:
      - ./data/storage:/app/.data/storage
