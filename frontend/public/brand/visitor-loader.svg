<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 50" width="130" height="125" style="color:#9B2C72" role="img" aria-label="HyCanvas is loading">
  <!-- The visitor, animated for loaders. One loop: the cursor arrives, the
       stroke gets painted and escapes the frame, the droplets fly, then the
       paint lifts and the visitor slips out to start again. Inherit color
       via currentColor (defaults to plum; set color on the svg or a parent
       to recolor). Respects prefers-reduced-motion by resting complete. -->
  <style>
    .ld * { animation-duration: 2.8s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    .paint { stroke-dasharray: 42 42; animation-name: ld-draw; }
    .d1 { transform-box: fill-box; transform-origin: center; animation-name: ld-pop1; }
    .d2 { transform-box: fill-box; transform-origin: center; animation-name: ld-pop2; }
    .cursor { animation-name: ld-cursor; }
    .ticks { animation-name: ld-ticks; }
    @keyframes ld-draw {
      0%, 14% { stroke-dashoffset: 42; opacity: 0; }
      15% { stroke-dashoffset: 42; opacity: 1; }
      52% { stroke-dashoffset: 0; opacity: 1; }
      84% { stroke-dashoffset: 0; opacity: 1; }
      94%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes ld-pop1 {
      0%, 48% { opacity: 0; transform: scale(0.2); }
      56% { opacity: 1; transform: scale(1.25); }
      62% { transform: scale(1); }
      84% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    @keyframes ld-pop2 {
      0%, 55% { opacity: 0; transform: scale(0.2); }
      63% { opacity: 1; transform: scale(1.25); }
      69% { transform: scale(1); }
      84% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    @keyframes ld-cursor {
      0% { opacity: 0; transform: translate(7px, 7px); }
      14% { opacity: 1; transform: translate(0, 0); }
      50% { transform: translate(0.6px, -0.8px); }
      68% { transform: translate(0, 0); }
      88% { opacity: 1; transform: translate(0, 0); }
      100% { opacity: 0; transform: translate(7px, 7px); }
    }
    @keyframes ld-ticks {
      0%, 4% { opacity: 0; }
      9% { opacity: 1; }
      20% { opacity: 0.35; }
      84% { opacity: 0.35; }
      92% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ld * { animation: none; }
      .paint { stroke-dashoffset: 0; }
    }
  </style>
  <g class="ld">
    <path d="M18.5 3L17.5 7M23.5 3L24.8 7" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M10 40.5L8 48M35.6 40.5L38 48" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <g transform="rotate(-5 19 24)">
      <rect x="7.5" y="10.5" width="23" height="25" fill="none" stroke="currentColor" stroke-width="3.2"/>
      <rect x="4.7" y="7.7" width="28.6" height="30.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <g fill="currentColor">
        <rect x="3" y="6" width="3.4" height="3.4" rx=".8"/><rect x="31.6" y="6" width="3.4" height="3.4" rx=".8"/>
        <rect x="3" y="36.6" width="3.4" height="3.4" rx=".8"/><rect x="31.6" y="36.6" width="3.4" height="3.4" rx=".8"/>
      </g>
    </g>
    <path class="paint" d="M12 30.5C16.5 24.5 22 23.5 26.5 18.5 29.5 15.2 32.5 12.2 36 9.8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <circle class="d1" cx="38.8" cy="7.6" r="1.5" fill="currentColor"/>
    <circle class="d2" cx="41.4" cy="5" r="1" fill="currentColor"/>
    <g class="cursor">
      <path transform="translate(38.5,31) scale(0.64)" d="M4 2l16 8-7 2-2 7z" fill="currentColor"/>
    </g>
    <path class="ticks" d="M38.2 30.8l-2.2-1.8M40.8 28.4l-1.7-2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
